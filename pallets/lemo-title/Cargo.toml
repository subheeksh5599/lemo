[package]
name = "pallet-lemo-title"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native LEMO title registry: revisioned records and the unbond guard."

[workspace]

[dependencies]
parity-scale-codec = { version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
frame-support = { version = "49.0.0", default-features = false }
frame-system = { version = "49.0.0", default-features = false }
sp-runtime = { version = "49.0.0", default-features = false }
sp-std = { version = "14.0.0", default-features = false }

[dev-dependencies]
sp-core = "43.0.0"
sp-io = "49.0.0"
pallet-balances = "51.0.2"

[features]
default = ["std"]
std = [
  "parity-scale-codec/std",
  "scale-info/std",
  "frame-support/std",
  "frame-system/std",
  "sp-runtime/std",
  "sp-std/std",
]
