name: ci

# Runs every test suite the README counts, on every push and pull request.
# Keyless: no secret is read, nothing is deployed or broadcast.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: forge (contracts + local lifecycle replay)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Contract tests
        run: forge test
      - name: Local lifecycle replay
        working-directory: local-evm
        run: forge test

  server:
    name: proof service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26  # the tests are .ts files run by Node's built-in type stripping
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      # the service imports shared code from the root lib/, so it needs the root packages too
      - name: Root packages
        working-directory: .
        run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  pallet:
    name: lemo-title pallet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pallets/lemo-title
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pallets/lemo-title
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: SKIP_WASM_BUILD=1 cargo test
