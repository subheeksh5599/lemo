[profile.default]
# Compile the repository's real contracts in place; nothing is copied.
src = "../contracts"
test = "test"
script = "script"
out = "out"
libs = ["../test/lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
# Same target as the repo: Portaldot V3's Revive interpreter rejects Cancun.
evm_version = "shanghai"
bytecode_hash = "none"
cbor_metadata = false
ffi = false
allow_paths = [".."]
fs_permissions = [
  { access = "read", path = "../fixtures" },
  { access = "read", path = "./" },
  { access = "read-write", path = "./results" },
]
remappings = [
  "forge-std/=/Users/subheeksh/code/lemo/test/lib/forge-std/src/",
  "lemo/=/Users/subheeksh/code/lemo/contracts/",
  "harness/=/Users/subheeksh/code/lemo/test/harness/",
]

[fmt]
line_length = 100
tab_width = 2
bracket_spacing = true
int_types = "long"
